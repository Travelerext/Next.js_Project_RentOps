name: Deploy to Alibaba Cloud ECS

on:
  push:
    branches: [main]
  workflow_dispatch: # 支持手动触发

jobs:
  validate:
    name: Validate Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          DATABASE_URL: "postgresql://placeholder"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      # ── 1. Rsync source code to server ──────────────────────────
      - name: Rsync files to server
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          TARGET: ${{ vars.DEPLOY_PATH || '/opt/rentops' }}
          EXCLUDE: .git, .github, .claude, .idea, node_modules, .env, .env.*, logs, *.md

      # ── 2. Install, build, migrate & restart ────────────────────
      - name: Build & restart on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,SUPABASE_SERVICE_ROLE_KEY
          script: |
            set -e

            DEPLOY_PATH="/opt/rentops"
            cd "$DEPLOY_PATH"

            echo "📝 Writing environment file..."
            cat > .env << ENVEOF
            NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
            SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
            ENVEOF

            echo "🔧 Injecting env vars into PM2 config..."
            sed -i "s|__NEXT_PUBLIC_SUPABASE_URL__|${NEXT_PUBLIC_SUPABASE_URL}|g" ecosystem.config.js
            sed -i "s|__NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY__|${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}|g" ecosystem.config.js
            sed -i "s|__SUPABASE_SERVICE_ROLE_KEY__|${SUPABASE_SERVICE_ROLE_KEY}|g" ecosystem.config.js

            echo "📦 Installing dependencies..."
            npm ci

            echo "🔨 Building app..."
            npm run build

            echo "🚀 Starting app..."
            mkdir -p logs
            pm2 reload ecosystem.config.js --update-env 2>/dev/null \
              || pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Deploy complete!"
